name: build
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: unzip -q AutoTotem-1.0.0-source-v4.zip -d auto-totem-build
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - working-directory: auto-totem-build/AutoTotem
        run: chmod +x ./gradlew && ./gradlew build --stacktrace
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AutoTotem-1.0.0-mc26.2
          path: auto-totem-build/AutoTotem/build/libs/
